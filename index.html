<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miguel Sánchez Godoy - Portafolio</title>
  <style>
    /* RESET Y ESTILOS BASE */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #cbbeff; /* Fondo violeta suave */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* TARJETA PRINCIPAL (ESTILO ANID) */
    .portfolio-card {
      background-color: #050508;
      width: 100%;
      max-width: 1200px;
      min-height: 680px;
      border-radius: 28px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2.5rem 4rem;
    }

    /* LUZ DE FONDO (AURA VIOLETA) */
    .glow-effect {
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(138, 92, 246, 0.45) 0%, rgba(59, 130, 246, 0.15) 45%, rgba(0, 0, 0, 0) 70%);
      border-radius: 50%;
      z-index: 1;
      pointer-events: none;
    }

    /* NAVEGACIÓN SUPERIOR */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .logo {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 2.5rem;
    }

    nav a {
      color: #a1a1aa;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #ffffff;
    }

    /* CUERPO PRINCIPAL (TRES COLUMNAS: TEXTO | FOTO | ESPECIALIDAD) */
    .main-content {
      display: grid;
      grid-template-columns: 1fr 340px 1fr;
      align-items: center;
      gap: 2rem;
      z-index: 5;
      margin: auto 0;
    }

    /* COLUMNA IZQUIERDA: NOMBRE Y GREETING */
    .left-col {
      text-align: left;
    }

    .greeting {
      font-size: 1.05rem;
      color: #a1a1aa;
      margin-bottom: 0.8rem;
    }

    h1 {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -1px;
    }

    /* COLUMNA CENTRO: FOTO CON INTEGRACIÓN RECTA */
    .center-col {
      display: flex;
      justify-content: center;
      position: relative;
    }

    .profile-img-wrapper {
      position: relative;
      width: 300px;
      height: 420px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }

    .profile-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }

    /* COLUMNA DERECHA: TÍTULO Y ESPECIALIDADES */
    .right-col {
      text-align: left;
    }

    .role-title {
      font-size: 1.8rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #ffffff 40%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .education-tag {
      font-size: 0.85rem;
      color: #a1a1aa;
      line-height: 1.5;
      border-left: 2px solid #8b5cf6;
      padding-left: 0.8rem;
    }

    /* FOOTER DE LA TARJETA: REDES Y RESUME */
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .social-links {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .social-icon {
      color: #a1a1aa;
      text-decoration: none;
      transition: color 0.3s;
      display: flex;
      align-items: center;
    }

    .social-icon:hover {
      color: #a78bfa;
    }

    .social-icon svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .resume-buttons {
      display: flex;
      gap: 1.5rem;
    }

    .btn-resume {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      opacity: 0.8;
      transition: opacity 0.3s;
    }

    .btn-resume:hover {
      opacity: 1;
      color: #a78bfa;
    }

    /* RESPONSIVO PARA PANTALLAS PEQUEÑAS */
    @media (max-width: 950px) {
      .portfolio-card {
        padding: 2rem;
      }
      .main-content {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 2rem;
      }
      .left-col, .right-col {
        text-align: center;
      }
      .card-footer {
        flex-direction: column;
        gap: 1.5rem;
      }
      .social-links {
        flex-direction: row;
      }
      nav {
        display: none;
      }
      .education-tag {
        border-left: none;
        border-top: 2px solid #8b5cf6;
        padding-left: 0;
        padding-top: 0.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="portfolio-card">
    <!-- Efecto Aura Violeta detrás de la foto -->
    <div class="glow-effect"></div>

    <!-- Navegación Superior -->
    <header>
      <div class="logo">Miguel Sánchez Godoy</div>
      <nav>

    <!-- Contenido Central -->
    <div class="main-content">
      <!-- Columna Izquierda -->
      <div class="left-col">

      </div>

      <div class="center-col">

      <div class="right-col">
        <div class="role-title">

        </div>
        <p class="education-tag">
          Graduated in Marketing BA Hons at<br>York St John University
        </p>
      </div>
    </div>

    <!-- Pie de Tarjeta (Redes + CV) -->
    <div class="card-footer">
      <!-- Redes Sociales Verticales -->
      <div class="social-links">
        <a href="mailto:miguisgodoy@gmail.com" class="social-icon" title="Email">
          <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        </a>
        <a href="https://www.linkedin.com/in/miguel-sanchez-godoy-097048256/" target="_blank" class="social-icon" title="LinkedIn">
          <svg viewBox="0 0 24 24"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/></svg>
        </a>
      </div>

      <!-- Enlaces a CV -->
      <div class="resume-buttons">
        <a href="#" class="btn-resume">RESUME (ES) ↗</a>
        <a href="#" class="btn-resume">RESUME (EN) ↗</a>
      </div>
    </div>
  </div>

</body>
</html>
