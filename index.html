<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>Miguel Sánchez Godoy - Portafolio</title>
  <style>
    /* RESET Y ESTILOS BASE */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background-color: #0b0e17;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* CANVAS DE ESTRELLAS (FONDO ESPACIAL) */
    #stars-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    /* ENCABEZADO / NAV */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 8%;
      position: absolute;
      width: 100%;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 0.5px;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 2rem;
    }

    nav a {
      color: #cccccc;
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #00d2ff;
    }

    .lang-toggle {
      font-size: 0.9rem;
      color: #888;
    }

    .lang-toggle span.active {
      color: #00d2ff;
      font-weight: bold;
    }

    /* SECCIÓN HERO (PRINCIPAL) */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10%;
      gap: 3rem;
    }

    .hero-content {
      max-width: 580px;
    }

    .greeting {
      font-size: 1.1rem;
      color: #a0a0a0;
      margin-bottom: 0.8rem;
    }

    h1 {
      font-size: 3.2rem;
      line-height: 1.1;
      margin-bottom: 1rem;
      font-weight: 700;
    }

    .highlight {
      color: #00d2ff;
    }

    .subtitle {
      font-size: 1.25rem;
      color: #d0d0d0;
      margin-bottom: 2rem;
      font-weight: 500;
    }

    /* BOTONES DE CV */
    .cv-buttons {
      display: flex;
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .btn-cv {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 0.75rem 1.6rem;
      border-radius: 25px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transition: all 0.3s ease;
      font-size: 0.95rem;
    }

    .btn-cv:hover {
      background: rgba(0, 210, 255, 0.15);
      border-color: #00d2ff;
      transform: translateY(-2px);
    }

    /* ICONOS SOCIALES */
    .social-icons {
      display: flex;
      gap: 1.2rem;
    }

    .icon-box {
      width: 48px;
      height: 48px;
      background: #ffffff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0b0e17;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .icon-box svg {
      width: 22px;
      height: 22px;
      fill: #0b0e17;
    }

    .icon-box:hover {
      transform: translateY(-4px);
      box-shadow: 0 5px 15px rgba(0, 210, 255, 0.4);
    }

    /* MARCO Y EFECTO DE GLOW PARA LA FOTO */
    .image-container {
      position: relative;
    }

    .image-container::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 105%;
      height: 105%;
      background: radial-gradient(circle, rgba(0, 210, 255, 0.35) 0%, rgba(0, 0, 0, 0) 70%);
      z-index: -1;
      border-radius: 35px;
    }

    .profile-img {
      width: 320px;
      height: 480px;
      object-fit: cover;
      object-position: top;
      border-radius: 24px;
      display: block;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* RESPONSIVO */
    @media (max-width: 900px) {
      header {
        padding: 1.5rem 5%;
      }
      nav {
        display: none;
      }
      .hero {
        flex-direction: column-reverse;
        justify-content: center;
        padding: 120px 5% 50px 5%;
        text-align: center;
      }
      .hero-content {
        max-width: 100%;
      }
      h1 {
        font-size: 2.4rem;
      }
      .cv-buttons, .social-icons {
        justify-content: center;
      }
      .profile-img {
        width: 260px;
        height: 380px;
      }
    }
  </style>
</head>

  <!-- Script del Fondo Animado -->
  <script>
    const canvas = document.getElementById('stars-canvas');
    const ctx = canvas.getContext('2d');

    let stars = [];
    const numStars = 160;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function initStars() {
      stars = [];
      for (let i = 0; i < numStars; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.5,
          alpha: Math.random(),
          speed: Math.random() * 0.015 + 0.005
        });
      }
    }

    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";

      stars.forEach(star => {
        star.alpha += star.speed;
        if (star.alpha > 1 || star.alpha < 0) {
          star.speed = -star.speed;
        }

        ctx.globalAlpha = Math.abs(star.alpha);
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      requestAnimationFrame(drawStars);
    }

    window.addEventListener('resize', () => {
      resizeCanvas();
      initStars();
    });

    resizeCanvas();
    initStars();
    drawStars();
  </script>
